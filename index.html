<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="PROJECT: SAGE-100 — 100 days of quests, XP and level-ups.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>PROJECT: SAGE-100</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PROJECT</p>
        <h1>SAGE-100</h1>
      </div>
      <button id="resetBtn" class="ghost danger" type="button">Reset</button>
    </header>

    <section class="hero card">
      <div class="hero-row">
        <div>
          <p class="muted">Current day</p>
          <div class="big-number" id="dayNumber">1</div>
        </div>
        <div class="level-box">
          <span id="levelLabel">Level 1</span>
          <strong id="xpLabel">0 XP</strong>
          <div class="progress"><span id="xpBar"></span></div>
          <small id="nextLevelLabel">100 XP to next level</small>
        </div>
      </div>
      <div class="streak-row">
        <span>🔥 Streak: <strong id="streakLabel">0</strong></span>
        <span>🏆 Completed: <strong id="completedLabel">0</strong>/100</span>
      </div>
    </section>

    <section class="card quest-card">
      <div class="section-title">
        <span class="badge" id="difficultyBadge">⭐</span>
        <span id="categoryLabel">Life</span>
      </div>
      <h2 id="questTitle">Loading quest...</h2>
      <p id="questDescription" class="quest-description"></p>
      <div class="quest-meta">
        <span id="xpReward">+10 XP</span>
        <span id="questStatus">Not completed</span>
      </div>
      <button id="completeBtn" class="primary" type="button">Complete Quest</button>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Side Quest</h2>
        <span id="sideXp">+5 XP</span>
      </div>
      <p id="sideQuestText"></p>
      <button id="sideCompleteBtn" class="secondary" type="button">Complete Side Quest</button>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>100-Day Map</h2>
        <span id="mapSummary">0%</span>
      </div>
      <div id="dayGrid" class="day-grid" aria-label="100 day progress"></div>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Level-Up Log</h2>
        <button id="randomBtn" class="small-btn" type="button">🎲 Random Quest</button>
      </div>
      <div id="log" class="log"></div>
    </section>

    <footer>Progress is saved on this device.</footer>
  </main>

  <dialog id="levelDialog">
    <div class="dialog-inner">
      <p class="eyebrow">LEVEL UP</p>
      <h2 id="levelUpTitle">SAGE LEVEL UP!</h2>
      <p id="levelUpText"></p>
      <button id="closeDialog" class="primary" type="button">LET'S GO</button>
    </div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
